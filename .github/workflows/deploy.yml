name: Deploy Vite React App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Update sitemap.xml lastmod date
        run: |
            $sitemapPath = "dist/sitemap.xml"
            $date = Get-Date -Format "yyyy-MM-dd"
            @'
            <?xml version="1.0" encoding="UTF-8"?>
            <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                <url>
                    <loc>https://pressurewashfranklintn.com/</loc>
                    <lastmod>$date</lastmod>
                    <changefreq>weekly</changefreq>
                    <priority>1.0</priority>
                </url>
            </urlset>
            '@ | Set-Content -Path $sitemapPath
        shell: powershell

      - name: Move dist folder to deployment location
        run: |
            if (Test-Path "C:\websites\pressurewashfranklintn") { Remove-Item -Recurse -Force "C:\websites\pressurewashfranklintn" }
            Move-Item -Path "dist" -Destination "C:\websites\pressurewashfranklintn"
        shell: powershell

